<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-title="browseTitle">प्रोफाइल सूची | उत्तरांचल विवाह मंच</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans:wght@400;600;700&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=30">
</head>
<body data-page="browse">
  <div id="app-header"></div>
  <section class="page-hero">
    <div class="container">
      <div class="breadcrumbs" data-i18n="crumbBrowse">होम / प्रोफाइल</div>
      <h1 id="pageHeading">वैवाहिक सूची</h1>
      <p data-i18n="browseLead">गढ़वाली-कुमाऊँनी वर-वधू। फ़ोन नंबर देखने के लिए लॉगिन करें।</p>
    </div>
  </section>
  <section class="section">
    <div class="container">
      <form class="filters" id="filterForm">
        <select name="gender">
          <option value="" data-i18n="filterAll">वर / वधू</option>
          <option value="groom" data-i18n="boys">लड़के</option>
          <option value="bride" data-i18n="girls">लड़कियां</option>
        </select>
        <select name="region">
          <option value="" data-i18n="region">क्षेत्र</option>
          <option value="garhwali" data-i18n="garhwali">गढ़वाली</option>
          <option value="kumaoni" data-i18n="kumaoni">कुमाऊँनी</option>
        </select>
        <select name="community">
          <option value="" data-i18n="community">समुदाय</option>
          <option value="brahmin" data-i18n="brahmin">ब्राह्मण</option>
          <option value="rajput" data-i18n="rajput">राजपूत</option>
          <option value="other" data-i18n="other">SC / ST / OBC</option>
        </select>
        <input name="caste" data-i18n-placeholder="surname" placeholder="जाति / सरनेम">
        <input name="city" data-i18n-placeholder="cityPh2" placeholder="शहर / पैतृक निवास">
        <input name="q" data-i18n-placeholder="nameOrId" placeholder="नाम या आईडी">
        <button class="btn btn-dark" data-i18n="filter">फ़िल्टर</button>
      </form>
      <div class="card-grid" id="list"></div>
    </div>
  </section>
  <div id="app-footer"></div>
   <script src="js/i18n.js?v=30"></script>
   <script src="js/profiles.js?v=30"></script>
   <script src="js/app.js?v=30"></script>
  <script>
    const form = document.getElementById("filterForm");
      ["gender", "region", "community", "caste", "city", "q", "age"].forEach((n) => {
        const v = qs(n);
        if (v && form.elements[n]) form.elements[n].value = v;
      });
      const filters = { gender: qs("gender") || "", region: qs("region") || "", community: qs("community") || "", caste: qs("caste") || "", city: qs("city") || "", q: qs("q") || "", age: qs("age") || "" };
    function renderList() {
      const titles = {
        "brahmin-groom": t("brahminBoys"),
        "brahmin-bride": t("brahminGirls"),
        "rajput-groom": t("rajputBoys"),
        "rajput-bride": t("rajputGirls"),
        "other-": t("otherCommunity")
      };
      document.getElementById("pageHeading").textContent = titles[`${filters.community}-${filters.gender}`] || t("listTitle");
      const rows = filterProfiles(PROFILES, filters);
      document.getElementById("list").innerHTML = rows.length ? rows.map(profileCard).join("") : "<p class='muted'>" + t("noProfiles") + "</p>";
    }
    window.onLangChange = renderList;
    renderList();
  </script>
</body>
</html>
