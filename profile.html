<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-title="profileTitle">बायोडाटा | उत्तरांचल विवाह मंच</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans:wght@400;600;700&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=31">
</head>
<body data-page="browse">
  <div id="app-header"></div>
  <section class="section">
    <div class="container" id="profileBox"></div>
  </section>
  <div id="app-footer"></div>
   <script src="js/i18n.js?v=31"></script>
   <script src="js/profiles.js?v=31"></script>
   <script src="js/app.js?v=31"></script>
  <script>
     const p = PROFILES.find((x) => x.id === qs("id")) || PROFILES[0];
     function renderProfile() {
       const logged = !!currentUser();
       const canSee = hasPrivateAccess();
       const lock = t("hidden");
       const ctaHref = logged ? "membership.html" : "login.html";
       const ctaLabel = logged ? t("takeMembership") : t("seePhone");
       const notice = canSee ? t("parentMasked") : (logged ? t("needMembership") : t("privateLocked"));
       const privateRows = canSee ? `
               <div><span>${t("father")}</span><b>${p.father}</b></div>
               <div><span>${t("mother")}</span><b>${p.mother}</b></div>
               <div><span>${t("phone")}</span><b>${p.phone}</b></div>
               <div><span>${t("addressNow")}</span><b>${p.presentAddress}</b></div>
               <div><span>${t("village")}</span><b>${p.village}</b></div>
               <div><span>${t("district")}</span><b>${p.district}</b></div>
               <div><span>${t("native")}</span><b>${p.native}</b></div>` : `
               <div class="locked"><span>${t("father")}</span><b>${lock}</b></div>
               <div class="locked"><span>${t("mother")}</span><b>${lock}</b></div>
               <div class="locked"><span>${t("phone")}</span><b>${lock}</b></div>
               <div class="locked"><span>${t("addressNow")}</span><b>${lock}</b></div>
               <div class="locked"><span>${t("village")}</span><b>${lock}</b></div>
               <div class="locked"><span>${t("district")}</span><b>${lock}</b></div>
               <div class="locked"><span>${t("native")}</span><b>${lock}</b></div>`;
       document.getElementById("profileBox").innerHTML = `
         <div class="profile-hero">
           <aside class="profile-aside">
             <img class="avatar-img" src="${p.photo}" alt="${p.name}">
             <span class="badge gold" style="margin-top:14px">${p.id}</span>
             <h1 style="margin:12px 0 6px">${p.name}</h1>
             <p>${communityLabel(p.community)} · ${genderLabel(p.gender)}</p>
             <p style="margin-top:18px">${p.city}</p>
             <a class="btn btn-primary" href="${canSee ? "my-matches.html" : ctaHref}" style="margin-top:22px;width:100%">${canSee ? t("openPhone") : ctaLabel}</a>
           </aside>
           <div style="padding:24px">
             <div class="notice">${notice}</div>
             <div class="detail-grid">
               <div><span>${t("dob")}</span><b>${p.dob}</b></div>
               <div><span>${t("age")}</span><b>${p.age} ${t("years")}</b></div>
               <div><span>${t("height")}</span><b>${p.height}</b></div>
               <div><span>${t("region")}</span><b>${p.region === "kumaoni" ? t("kumaoni") : t("garhwali")}</b></div>
               <div><span>${t("caste")}</span><b>${p.caste}</b></div>
               <div><span>${t("gotra")}</span><b>${p.gotra}</b></div>
               <div><span>${t("education")}</span><b>${p.education}</b></div>
               <div><span>${t("job")}</span><b>${p.job}</b></div>
               <div><span>${t("salary")}</span><b>${p.salary}</b></div>
               <div><span>${t("manglik")}</span><b>${p.manglik}</b></div>
               ${privateRows}
             </div>
             <div style="margin-top:22px;display:flex;gap:10px;flex-wrap:wrap">
               <a class="btn btn-dark" href="browse.html">${t("backList")}</a>
               <a class="btn btn-ghost" href="${logged ? "my-matches.html" : "login.html"}">${t("myMatches")}</a>
             </div>
           </div>
         </div>`;
     }
    window.onLangChange = renderProfile;
    renderProfile();
  </script>
</body>
</html>
